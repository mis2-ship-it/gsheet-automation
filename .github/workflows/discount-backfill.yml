name: Discount history backfill (monthly, day level)

on:
  workflow_dispatch:
    inputs:
      from:
        description: "First day to cover, YYYY-MM-DD (its month is pulled whole)"
        required: true
        default: "2025-11-01"
      to:
        description: "Last day to cover, YYYY-MM-DD (its month is pulled whole)"
        required: true
        default: "2026-08-31"
      budget_minutes:
        description: "No new month is started after this many minutes"
        required: false
        default: "330"

permissions:
  contents: write            # archived months are committed to the repository

concurrency:
  group: discount-rows       # shares the group with the nightly job: the two never write the cache at the same time
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360     # the script stops itself at budget_minutes, before this limit
    env:
      API_KEY: ${{ secrets.API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

      run: pip install pandas numpy requests pyjwt gspread google-auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas numpy requests pyjwt

      # The latest saved rows (nightly or an earlier backfill), so this run adds to them.
      - name: Restore the saved rows
        uses: actions/cache/restore@v4
        with:
          path: |
            data/discount_rows.csv
            data/product_rows.csv
            data/product_recon.csv
          key: discount-v3-${{ github.run_id }}
          restore-keys: |
            discount-v3-

      - name: Pull each month and archive it
        run: >
          python backfill_discount_history.py --from "${{ inputs.from }}" --to "${{ inputs.to }}"
          --budget-minutes "${{ inputs.budget_minutes }}" --commit

      # Saved even when the budget ends the run early, so the next run carries on.
      - name: Save the rows for later runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/discount_rows.csv
            data/product_rows.csv
            data/product_recon.csv
          key: discount-v3-${{ github.run_id }}
