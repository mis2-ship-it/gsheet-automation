name: Rista Historical Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  historical-backfill:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests PyJWT gspread google-auth

      # =====================================================
      # RUN HISTORICAL BACKFILL
      # =====================================================

      - name: Run Rista Historical Backfill
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          echo "=========================================="
          echo "Running Rista Historical Backfill..."
          echo "=========================================="

          python rista_historical_backfill.py

      # =====================================================
      # COMMIT GENERATED CSV FILES
      # =====================================================

      - name: Commit Historical CSV Files
        run: |

          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add monthly_data/

          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi

          git commit -m "Backfill historical Rista monthly CSV data"

          # =================================================
          # SYNC WITH REMOTE BEFORE PUSH
          # =================================================

          git pull --rebase origin main

          # =================================================
          # PUSH CSV FILES
          # =================================================

          git push origin main
