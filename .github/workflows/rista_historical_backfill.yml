name: Rista Historical Backfill & Daily Refresh

on:
  workflow_dispatch:     # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  historical-backfill:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests PyJWT gspread google-auth

      # =====================================================
      # RUN HISTORICAL BACKFILL & SUMMARY GENERATION
      # =====================================================

      - name: Run Rista Historical Backfill
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          echo "=========================================="
          echo "Running Rista Historical Backfill & Summary Generation..."
          echo "=========================================="

          python rista_historical_backfill.py

      # =====================================================
      # COMMIT GENERATED CSV & SUMMARY FILES
      # =====================================================

      - name: Commit Historical CSV & Summary Files
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage monthly files, full compressed data, and the dashboard summary CSV
          git add monthly_data/
          git add historical_data/historical_sales.csv.gz
          git add historical_data/historical_sales_summary.csv

          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi

          git commit -m "Auto-update daily historical sales data and summary CSV"

          # =================================================
          # SYNC WITH REMOTE BEFORE PUSH
          # =================================================

          git pull --rebase origin main

          # =================================================
          # PUSH CHANGES
          # =================================================

          git push origin main
