name: Product mix build

# Builds product_mix.json.gz (the Morning Call's product mix) from the sales/page product rows.
# It pulls the product rows itself (the last 14 days up to yesterday), so it does not depend on the discount
# job's cache. Run it manually; the file is uploaded as an artifact, not committed.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "First day, YYYY-MM-DD (empty = 14 days before the last day)"
        required: false
        default: ""
      to:
        description: "Last day, YYYY-MM-DD (empty = yesterday, India time)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: product-mix
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: ${{ secrets.API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas numpy requests pyjwt gspread google-auth

      - name: Work out the days
        id: days
        run: |
          to="${{ inputs.to }}"
          from="${{ inputs.from }}"
          if [ -z "$to" ]; then to=$(TZ=Asia/Kolkata date -d "yesterday" +%F); fi
          if [ -z "$from" ]; then from=$(date -d "$to -13 days" +%F); fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          echo "Pulling product rows from $from to $to"

      - name: Pull the product rows (sales/page)
        run: >
          python sync_discounts.py --out data/discount_rows.csv --products-out data/product_rows.csv
          --recon-out data/product_recon.csv
          --from "${{ steps.days.outputs.from }}" --to "${{ steps.days.outputs.to }}"

      - name: Check the product rows are there
        run: |
          if [ ! -s data/product_rows.csv ]; then
            echo "::error::data/product_rows.csv was not written. Check the pull step above."
            exit 1
          fi
          echo "product rows: $(wc -l < data/product_rows.csv) lines"

      - name: Build the product mix
        run: python build_product_mix.py --rows data/product_rows.csv --out product_mix.json.gz

      - name: Show the result
        run: |
          python - << 'PY'
          import gzip, json
          d = json.load(gzip.open("product_mix.json.gz", "rt"))
          print("latest day:", d["ref"], "| categories:", len(d["categories"]), "| rows:", len(d["rows"]))
          PY

      - name: Save the product mix
        uses: actions/upload-artifact@v4
        with:
          name: product-mix-${{ github.run_id }}
          path: product_mix.json.gz
          retention-days: 30
          if-no-files-found: error
