name: Rista MTD Update

on:
  workflow_dispatch:

concurrency:
  group: mtd-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-mtd:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run MTD Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          RUN_MODE: MTD

        run: |
          echo "Running MTD Update..."
          python rista_mtd_report.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
      
          git add monthly_data/
      
          git commit -m "Auto update monthly MTD CSV" || echo "No changes"
      
          # Refresh remote main before pushing
          git fetch origin main
      
          # Re-apply this workflow's commit on top of latest remote main
          git rebase origin/main
      
          # Push updated branch
          git push origin HEAD:main
