name: Historical Data Refresh

on:
  workflow_dispatch:

  schedule:
    # Daily at 01:00 UTC = 06:30 AM IST
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  refresh-historical-data:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # PYTHON
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # INSTALL
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      # --------------------------------------------------
      # REFRESH HISTORICAL DATA
      # --------------------------------------------------

      - name: Build historical dataset
        run: |
          python historical_data_refresh.py

      # --------------------------------------------------
      # CHECK RESULT
      # --------------------------------------------------

      - name: Check historical output
        run: |
          echo "=============================================="
          echo "Historical data files"
          echo "=============================================="

          ls -lh historical_data/ || true

          echo "=============================================="
          echo "Git status"
          echo "=============================================="

          git status --short

      # --------------------------------------------------
      # COMMIT UPDATED DATA
      # --------------------------------------------------

      - name: Commit historical data
        run: |

          git config user.name "AI MIS Automation"
          git config user.email "ai-mis-automation@users.noreply.github.com"

          git add historical_data/

          if git diff --cached --quiet; then
            echo "✅ No historical data changes"
          else
            git commit -m "Refresh historical sales data"
            git push
            echo "✅ Historical data committed"
          fi
