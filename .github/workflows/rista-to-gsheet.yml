name: Rista Live to GSheet Hourly

on:

  workflow_dispatch:

jobs:

  # ==================================================
  # LIVE DASHBOARD - HOURLY
  # ==================================================

  live-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Commit and push summary
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          if [ -f "live_sales_summary.json" ]; then
            git add live_sales_summary.json
            git commit -m "Auto-update live sales summary" || echo "No changes to commit"
            git push
          else
            echo "live_sales_summary.json was not created, skipping git commit."
          fi
          
      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run Live Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_DATA_SECRET: ${{ secrets.WHATSAPP_DATA_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}

        run: |
          echo "Running Live Dashboard..."
          python rista_live.py
