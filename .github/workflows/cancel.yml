name: Cancellation pull

# Pulls voided and cancelled orders (with the reason) from Rista's /sale endpoint for a date range.
# Kept apart from the Closed sales history. The output is uploaded as an artifact, not committed.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "First business day, YYYY-MM-DD"
        default: "2025-04-01"
        required: true
        type: string
      to:
        description: "Last business day, YYYY-MM-DD"
        default: "2025-04-30"
        required: true
        type: string
      branches:
        description: "Optional comma list of branch codes (leave empty for all active branches)"
        default: ""
        required: false
        type: string
      endpoint:
        description: "Rista endpoint for orders (the same one the discount sync uses)"
        default: "/sales/page"
        required: false
        type: string
      reason_field:
        description: "Name of the cancel reason field, or auto to find it"
        default: "auto"
        required: false
        type: string
      status_field:
        description: "Name of the status field in the response"
        default: "auto"
        required: false
        type: string
      probe:
        description: "Only check which request the API accepts (use this first)"
        default: false
        required: false
        type: boolean
      workers:
        description: "Parallel requests (raise only if the API allows it)"
        default: "8"
        required: false
        type: string
      fresh:
        description: "Ignore saved branch-days and pull again"
        default: false
        required: false
        type: boolean

permissions:
  contents: write

# Its own group, so a cancellation pull never waits for, or blocks, the sales dashboard job.
concurrency:
  group: cancel-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 180          # a month of branch-days takes a while
    env:
      API_KEY: ${{ secrets.API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      FROM_DAY: ${{ inputs.from }}
      TO_DAY: ${{ inputs.to }}
      BRANCHES: ${{ inputs.branches }}
      ENDPOINT: ${{ inputs.endpoint }}
      REASON_FIELD: ${{ inputs.reason_field }}
      STATUS_FIELD: ${{ inputs.status_field }}
      WORKERS: ${{ inputs.workers }}
      FRESH: ${{ inputs.fresh }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas numpy requests pyjwt gspread google-auth

      - name: Check the dates
        run: |
          for d in "$FROM_DAY" "$TO_DAY"; do
            if ! [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::'$d' is not a date in YYYY-MM-DD form"
              exit 1
            fi
          done
          if [[ "$FROM_DAY" > "$TO_DAY" ]]; then
            echo "::error::from ($FROM_DAY) is after to ($TO_DAY)"
            exit 1
          fi
          echo "Pulling $FROM_DAY to $TO_DAY"

      # The script's own checks run first, so a broken script fails before any API calls.
      - name: Check the script
        run: |
          python tests/test_cancel_sales.py
          python tests/test_cancel_speed.py
          python tests/test_cancel_probe.py

      # Branch-days already pulled by an earlier run are kept in the cache, so a run that stops can carry on.
      - name: Restore the saved branch-days
        uses: actions/cache/restore@v4
        with:
          path: data/cancel/raw
          key: cancel-raw-${{ github.run_id }}
          restore-keys: |
            cancel-raw-

      - name: Probe the endpoints (first check)
        if: ${{ inputs.probe }}
        run: |
          ARGS=(--probe --from "$FROM_DAY" --out data/cancel)
          if [ -n "$BRANCHES" ]; then ARGS+=(--branches "$BRANCHES"); fi
          python cancel_sales.py "${ARGS[@]}"

      - name: Pull the cancelled orders
        id: pull
        if: ${{ !inputs.probe }}
        run: |
          ARGS=(--from "$FROM_DAY" --to "$TO_DAY" --out data/cancel
                --endpoint "$ENDPOINT" --reason-field "$REASON_FIELD" --status-field "${{ inputs.status_field }}"
                --workers "$WORKERS")
          if [ -n "$BRANCHES" ]; then ARGS+=(--branches "$BRANCHES"); fi
          if [ "$FRESH" = "true" ]; then ARGS+=(--fresh); fi
          python cancel_sales.py "${ARGS[@]}"

      - name: Save the branch-days for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cancel/raw
          key: cancel-raw-${{ github.run_id }}

      # The first lines of the results go to the job log, so the counts are visible without downloading.
      - name: Show the summary
        if: always()
        run: |
          if [ -f data/cancel/probe_report.json ]; then echo "== probe report"; cat data/cancel/probe_report.json; fi
          for f in data/cancel/status_seen_*.csv data/cancel/cancel_reasons_seen_*.csv; do
            [ -f "$f" ] || continue
            echo "== $f"
            head -40 "$f"
          done
          if [ -f data/cancel/cancel_errors.csv ]; then
            echo "== branch-days that failed"
            cat data/cancel/cancel_errors.csv
          fi

      # Uploaded even when some branch-days failed, so the results can be checked.
      - name: Save the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cancel-${{ inputs.from }}-to-${{ inputs.to }}
          path: |
            data/cancel/
            !data/cancel/raw/
          retention-days: 30
          if-no-files-found: warn

      - name: Add the cancelled orders to the stored file
        if: inputs.probe != true
        env:
          FROM_DAY: ${{ inputs.from }}
          TO_DAY: ${{ inputs.to }}
        run: |
          python merge_cancel.py --new "data/cancel/cancel_invoices_${FROM_DAY}_${TO_DAY}.csv" --master data/cancel_orders.csv.gz

      - name: Commit the stored file to the repository
        if: inputs.probe != true
        env:
          FROM_DAY: ${{ inputs.from }}
          TO_DAY: ${{ inputs.to }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cancel_orders.csv.gz
          if git diff --cached --quiet; then
            echo "no change to the stored cancel orders"
            exit 0
          fi
          git commit -m "cancel orders ${FROM_DAY} to ${TO_DAY}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
