name: DSR Dashboard Daily Report

on:
  workflow_dispatch:

jobs:
  DSR_Dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DSR Dashboard
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SENDER_EMAIL: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: "vivek@frozenbottle.in, mis2@frozenbottle.in, bhaskar@eatfit.in, scm@frozenbottle.in, prasanth.a@frozenbottle.in, sandeep.ss@eatfit.in, sonal.raj@curefoods.in, Ops.all@frozenbottle.in, mayank.agarwal@curefoods.in"
          EMAIL_CC: "pranshul@frozenbottle.in, arun.k@frozenbottle.in, samir.pandey@frozenbottle.in"

        run: |
          echo "🚀 Starting DSR Dashboard Generation..."
          python dsr_dashboard.py
          echo "✅ DSR Dashboard completed successfully!"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsr-dashboard-output
          path: |
            dsr_dashboard.xlsx
            dsr_dashboard.html
          retention-days: 7
