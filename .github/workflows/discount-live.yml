name: Discount Code live (today so far)

on:
  schedule:
    - cron: "*/30 3-23 * * *"   # every 30 minutes, about 08:30 to 04:30 IST (cron times are UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discount-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_KEY: ${{ secrets.API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      DISCOUNT_SHEET_ID: ${{ secrets.DISCOUNT_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas numpy requests pyjwt gspread google-auth

      # No cache here. Last week's hours are read from the Disc_Hour tab that the nightly run writes.
      - name: Pull today's Swiggy and Zomato orders
        run: |
          mkdir -p data
          python sync_discounts.py --live --out data/discount_live.csv

      - name: Write today's hours into the Disc_Hour tab
        run: python write_discount_sheet.py --live data/discount_live.csv --only-hourly
