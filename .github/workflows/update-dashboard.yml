name: Update sales dashboard

on:
  schedule:
    - cron: "0 */2 * * *"    # every 2 hours: live sales and ratings (use "*/30 * * * *" if the repo stays public)
    - cron: "30 1 * * *"     # 07:00 IST every day: completed days and hourly rows
  workflow_dispatch:
    inputs:
      mode:
        description: "nightly or live"
        default: "live"
        required: false

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas numpy requests pyjwt gspread google-auth pillow

      # The daily and hourly files are kept in GitHub's cache, not in the repo, so the repo does not grow every night.
      - name: Restore the saved sales files
        uses: actions/cache/restore@v4
        with:
          path: |
            data/new_sales.csv.gz
            data/new_hourly.csv.gz
          key: sales-data-${{ github.run_id }}
          restore-keys: |
            sales-data-

      - name: Completed days from Rista (nightly only)
        id: nightly
        if: github.event.schedule == '30 1 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')
        run: python sync_sales.py --mode nightly --since 2026-09-01 --out data/new_sales.csv.gz --hourly-out data/new_hourly.csv.gz

      - name: Save the sales files for later runs (nightly only)
        if: steps.nightly.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            data/new_sales.csv.gz
            data/new_hourly.csv.gz
          key: sales-data-${{ github.run_id }}

      - name: Today so far from Rista
        run: python sync_sales.py --mode live --out data/live_sales.csv

      - name: Ratings from the three sheets
        run: python sync_ratings.py --out data/ratings.csv

      - name: Build dashboard data
        run: |
          EXTRA=""
          if [ -f data/new_sales.csv.gz ]; then EXTRA="$EXTRA --new data/new_sales.csv.gz"; fi
          if [ -f data/new_hourly.csv.gz ]; then EXTRA="$EXTRA --new-hourly data/new_hourly.csv.gz"; fi
          python build_site.py --history historical_data/historical_sales.csv.gz $EXTRA \
            --live data/live_sales.csv --ratings data/ratings.csv --out site/data

      - name: Deploy to app.frozenbottle.com
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=frozenbottle-sales --branch=main
