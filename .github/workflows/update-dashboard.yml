name: Update sales dashboard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "nightly or live"
        default: "live"
        required: false

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_KEY: ${{ secrets.API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas numpy requests pyjwt gspread google-auth pillow

      # The daily and hourly files are kept in GitHub's cache, not in the repo, so the repo does not grow every night.
      - name: Restore the saved sales files
        uses: actions/cache/restore@v4
        with:
          path: |
            data/new_sales.csv.gz
            data/new_hourly.csv.gz
          key: sales-data-${{ github.run_id }}
          restore-keys: |
            sales-data-

      - name: Completed days from Rista (nightly only)
        id: nightly
        if: github.event.schedule == '30 1 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')
        run: python sync_sales.py --mode nightly --since 2026-09-01 --out data/new_sales.csv.gz --hourly-out data/new_hourly.csv.gz

      - name: Save the sales files for later runs (nightly only)
        if: steps.nightly.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            data/new_sales.csv.gz
            data/new_hourly.csv.gz
          key: sales-data-${{ github.run_id }}

      - name: Today so far from Rista
        run: python sync_sales.py --mode live --out data/live_sales.csv

      - name: Ratings from the three sheets
        run: python sync_ratings.py --out data/ratings.csv

      - name: User access from POS_Master_Dashboard
        run: python sync_access.py --out data/access.csv

      # The KPT and O2D order file is saved by the "KPT and O2D Orders" workflow.
      - name: Restore the KPT order file
        uses: actions/cache/restore@v4
        with:
          path: data/kpt_orders.csv
          key: kpt-orders-${{ github.run_id }}
          restore-keys: |
            kpt-orders-

      - name: Check the KPT file before the build
        run: |
          ls -la data/
          if [ -s data/kpt_orders.csv ]; then echo "KPT file found: $(wc -l < data/kpt_orders.csv) lines"; else echo "KPT file MISSING"; fi

      # One data set is built for each login. Each login only receives its own stores.
      - name: Restore the discount rows file
        uses: actions/cache/restore@v4
        with:
          path: data/discount_rows.csv
          key: discount-rows-${{ github.run_id }}
          restore-keys: |
            discount-rows-

      - name: Build one data set per login
        run: |
          EXTRA=""
          if [ -f data/new_sales.csv.gz ]; then EXTRA="$EXTRA --new data/new_sales.csv.gz"; fi
          if [ -f data/new_hourly.csv.gz ]; then EXTRA="$EXTRA --new-hourly data/new_hourly.csv.gz"; fi
          python build_groups.py --access data/access.csv --history historical_data/historical_sales.csv.gz $EXTRA \
            --live data/live_sales.csv --ratings data/ratings.csv --kpt data/kpt_orders.csv --discounts data/discount_rows.csv

      # Stop before deploying if anything would expose data without the login check.
      - name: Safety check before deploy
        run: |
          if [ -d site/data ]; then echo "Public data folder found: stopping"; exit 1; fi
          if [ ! -f functions/_access.json ]; then echo "Access map missing: stopping"; exit 1; fi
          if [ ! -f "functions/data/[[path]].js" ]; then echo "Access function missing: stopping"; exit 1; fi

      - name: Deploy to app.frozenbottle.com
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=frozenbottle-sales --branch=main
