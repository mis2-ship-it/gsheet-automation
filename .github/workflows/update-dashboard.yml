name: Update sales dashboard

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes: live sales and ratings
    - cron: "30 1 * * *"     # 07:00 IST every day: completed days (also commits them)
  workflow_dispatch:
    inputs:
      mode:
        description: "nightly or live"
        default: "live"
        required: false

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas requests pyjwt gspread google-auth

      - name: Completed days from Rista (nightly only)
        id: nightly
        if: github.event.schedule == '30 1 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')
        run: |
          python scripts/sync_sales.py --mode nightly --since 2026-09-01 --out data/new_sales.csv.gz

      - name: Commit completed days (nightly only)
        if: steps.nightly.outcome == 'success'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/new_sales.csv.gz
          git commit -m "Completed sales days up to yesterday" || echo "nothing to commit"
          git push

      - name: Today so far from Rista
        run: python sync_sales.py --mode live --out data/live_sales.csv

      - name: Ratings from the three sheets
        run: python sync_ratings.py --out data/ratings.csv

      - name: Build dashboard data
        run: |
          EXTRA=""
          if [ -f data/new_sales.csv.gz ]; then EXTRA="--new data/new_sales.csv.gz"; fi
          python scripts/build_site.py --history data/historical_sales.csv.gz $EXTRA \
            --live data/live_sales.csv --ratings data/ratings.csv --out site/data

      - name: Deploy to app.frozenbottle.com
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=frozenbottle-sales --branch=main
