name: Discount Code, product and reconciliation rows (sales/page)

on:
  schedule:
    - cron: "15 2 * * *"      # 07:45 IST daily: yesterday and the two days before
  workflow_dispatch:
    inputs:
      from:
        description: "First day to pull, YYYY-MM-DD (empty = 2026-09-01). Use chunks for the first backfill."
        required: false
        default: ""
      to:
        description: "Last day to pull, YYYY-MM-DD (empty = yesterday)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: discount-rows
  cancel-in-progress: false

jobs:
  discounts:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      API_KEY: ${{ secrets.API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      DISCOUNT_SHEET_ID: ${{ secrets.DISCOUNT_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas numpy requests pyjwt gspread google-auth

      # The key prefix is new (v3): product gross and net now come from the item gross and net, so earlier saved rows are not restored.
      - name: Restore the saved rows
        uses: actions/cache/restore@v4
        with:
          path: |
            data/discount_rows.csv
            data/product_rows.csv
            data/product_recon.csv
          key: discount-v3-${{ github.run_id }}
          restore-keys: |
            discount-v3-

      - name: Pull sales/page (all Active branches, all pages)
        run: >
          python sync_discounts.py --out data/discount_rows.csv --products-out data/product_rows.csv
          --recon-out data/product_recon.csv --from "${{ inputs.from }}" --to "${{ inputs.to }}"

      - name: Save the rows for later runs
        uses: actions/cache/save@v4
        with:
          path: |
            data/discount_rows.csv
            data/product_rows.csv
            data/product_recon.csv
          key: discount-v3-${{ github.run_id }}

      - name: Write the Discount Dashboard tabs
        run: >
          python write_discount_sheet.py --rows data/discount_rows.csv --products data/product_rows.csv
          --recon data/product_recon.csv --keep-days 400 --product-days 62
