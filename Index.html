<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discount Dashboard</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:16px;background:#0A1020;color:#E5ECF8;font-size:14px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:22px 0 6px}
.sub{color:#9AA8C2;font-size:12px;margin:0 0 8px}
.note{color:#9AA8C2;font-size:12px;margin:6px 0}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
label{font-size:12px;color:#9AA8C2;display:flex;flex-direction:column;gap:3px}
select,input{background:#121C33;color:#E5ECF8;border:1px solid #24314f;border-radius:6px;padding:7px;font-size:13px}
button{background:#3B82F6;color:#fff;border:0;border-radius:6px;padding:9px 14px;font-size:13px;cursor:pointer;margin-right:6px}
button.ghost{background:#121C33;border:1px solid #24314f}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid #24314f;text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr.tot td{font-weight:bold;border-top:2px solid #3B82F6}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
.clist{max-height:200px;overflow:auto;border:1px solid #24314f;border-radius:8px;padding:6px;margin-top:6px}
.clist label{flex-direction:row;align-items:center;gap:6px;padding:2px 0;color:#E5ECF8;font-size:12px}
.up{color:#34D399}
.down{color:#F87171}
</style>
</head>
<body>
<h1>Discount Dashboard</h1>
<p class="sub">Swiggy and Zomato orders by discount code. Each order counts once, under its discount label. Net = Gross − Discount. Dis % = Discount ÷ Gross. ₹.</p>

<div class="controls">
  <label>Date <input id="anchor" type="date"></label>
  <label>Period
    <select id="kind">
      <option value="daily">Daily</option>
      <option value="weekly">Weekly (7 days)</option>
      <option value="monthly" selected>Monthly</option>
      <option value="mtd">Month to date</option>
    </select>
  </label>
  <label>Brand <select id="brand"><option value="all">All brands</option></select></label>
  <label>Region <select id="region"><option value="all">All regions</option></select></label>
  <label>Source <select id="source"><option value="all">All sources</option></select></label>
  <label>Session <select id="session"><option value="all">All sessions</option></select></label>
</div>
<button id="calc">Calculate</button>
<span id="status" class="sub"></span>

<div id="out"></div>

<script>
var OPTS = null;
var LAST = null;
var STATE = { code: "all", cats: null, search: "", searching: false };

function $(id) { return document.getElementById(id); }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function attr(t) { return esc(t).replace(/"/g, "&quot;"); }
function inr(n) { return (n === null || n === undefined || isNaN(n)) ? "—" : Math.round(n).toLocaleString("en-IN"); }
function pct(x) {
  if (x === null || x === undefined || isNaN(x)) return "—";
  return '<span class="' + (x >= 0 ? "up" : "down") + '">' + (x >= 0 ? "▲ " : "▼ ") + Math.abs(x * 100).toFixed(1) + "%</span>";
}
function growth(cur, prev) { return prev > 0 ? pct(cur / prev - 1) : "—"; }
function dpct(d, g) { return g > 0 ? (d / g * 100).toFixed(1) + "%" : "—"; }
function catOn(c) { return STATE.cats === null || STATE.cats.indexOf(c) >= 0; }

function setOptions(o) {
  OPTS = o;
  var a = $("anchor");
  a.min = o.first; a.max = o.latest; a.value = o.latest;
  fill("brand", o.brands); fill("region", o.regions); fill("source", o.sources); fill("session", o.sessions);
  calc();
}
function fill(id, list) {
  var sel = $(id);
  var first = sel.options[0].outerHTML;
  sel.innerHTML = first + list.map(function (v) { return '<option value="' + attr(v) + '">' + esc(v) + "</option>"; }).join("");
}

function calc() {
  var p = {
    anchor: $("anchor").value, kind: $("kind").value, brand: $("brand").value, region: $("region").value,
    source: $("source").value, session: $("session").value, code: STATE.code
  };
  if (!p.anchor) { $("status").textContent = "Choose a date."; return; }
  $("status").textContent = "Calculating…";
  google.script.run.withSuccessHandler(render).withFailureHandler(fail).getDiscountData(p);
}
function fail(e) { $("status").textContent = "Error: " + (e && e.message ? e.message : e); }

function render(d) {
  LAST = d;
  $("status").textContent = "Showing " + d.meta.cur + " against " + d.meta.prev + " (" + d.meta.note + ").";
  renderOutput();
}

function renderOutput() {
  if (!LAST) return;
  $("out").innerHTML = codeTable(LAST) + itemsBlock(LAST);
  if (STATE.searching) {
    var s = $("csearch");
    if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    STATE.searching = false;
  }
}

function codeTable(d) {
  var rows = d.labels.slice().sort(function (a, b) { return b.cur.net - a.cur.net; });
  var t = d.totals.cur, tp = d.totals.prev;
  var line = function (name, c, p, cls) {
    return "<tr class='" + (cls || "") + "'><td class='l'>" + esc(name) + "</td><td>" + inr(c.inv) + "</td><td>" + inr(c.qty) +
      "</td><td>" + inr(c.gross) + "</td><td>" + inr(c.disc) + "</td><td>" + inr(c.net) + "</td><td>" + growth(c.net, p.net) +
      "</td><td>" + dpct(c.disc, c.gross) + "</td><td>" + (c.inv ? inr(c.net / c.inv) : "—") + "</td></tr>";
  };
  var body = line("Total", t, tp, "tot") + rows.map(function (x) { return line(x.label, x.cur, x.prev, ""); }).join("");
  return "<h2>By discount code</h2>" +
    "<p class='note'>Txn = orders. Net growth compares with " + esc(d.meta.prev) + ".</p>" +
    "<div class='scroll'><table><thead><tr><th class='l'>Discount code</th><th>Txn</th><th>Qty</th><th>Gross</th><th>Discount</th>" +
    "<th>Net</th><th>Net growth</th><th>Dis %</th><th>AOV</th></tr></thead><tbody>" + body + "</tbody></table></div>" +
    "<p class='note'><button class='ghost' onclick='downloadCodes()'>Download discount codes (CSV)</button></p>";
}

function filteredItems(d) {
  return d.items.filter(function (x) { return catOn(x.cat); }).sort(function (a, b) { return b.cur.net - a.cur.net; });
}

function itemsBlock(d) {
  var codes = '<option value="all">All discount codes</option>' + OPTS.labels.map(function (v) {
    return '<option value="' + attr(v) + '"' + (STATE.code === v ? " selected" : "") + ">" + esc(v) + "</option>";
  }).join("");
  var q = STATE.search.trim().toLowerCase();
  var matches = OPTS.categories.filter(function (c) { return !q || c.toLowerCase().indexOf(q) >= 0; });
  var checks = matches.slice(0, 300).map(function (c) {
    return '<label><input type="checkbox" data-cat="' + attr(c) + '"' + (catOn(c) ? " checked" : "") + "> " + esc(c) + "</label>";
  }).join("") || '<span class="sub">No category matches "' + esc(STATE.search) + '".</span>';
  var selectedCount = STATE.cats === null ? OPTS.categories.length : STATE.cats.length;
  var items = filteredItems(d);
  var tot = items.reduce(function (t, x) {
    t.qty += x.cur.qty; t.gross += x.cur.gross; t.disc += x.cur.disc; t.net += x.cur.net; return t;
  }, { qty: 0, gross: 0, disc: 0, net: 0 });
  var rows = items.map(function (x) {
    var c = x.cur;
    return "<tr><td class='l'>" + esc(x.item) + "</td><td class='l'>" + esc(x.cat) + "</td><td>" + inr(c.inv) + "</td><td>" + inr(c.qty) +
      "</td><td>" + inr(c.gross) + "</td><td>" + inr(c.disc) + "</td><td>" + inr(c.net) + "</td><td>" + dpct(c.disc, c.gross) + "</td></tr>";
  }).join("");
  var totalRow = items.length ? "<tr class='tot'><td class='l'>Total</td><td>—</td><td>" + inr(tot.qty) + "</td><td>" + inr(tot.gross) +
    "</td><td>" + inr(tot.disc) + "</td><td>" + inr(tot.net) + "</td><td>" + dpct(tot.disc, tot.gross) + "</td></tr>" : "";
  return "<h2>By item</h2>" +
    "<p class='note'>Pick a discount code and categories. Type in the category box to find categories, for example 70%. " +
    "Txn is not added up across items, because one order can have several items.</p>" +
    "<div class='grid2'>" +
    "<label>Discount code<select id='dcode'>" + codes + "</select></label>" +
    "<div><label>Category (search)<input id='csearch' type='search' value='" + attr(STATE.search) + "' placeholder='e.g. 70%'></label>" +
    "<p class='note'><button class='ghost' data-cat-all='1'>All</button><button class='ghost' data-cat-none='1'>None</button> " +
    selectedCount + " of " + OPTS.categories.length + " selected</p>" +
    "<div class='clist'>" + checks + "</div></div></div>" +
    "<div class='scroll'><table><thead><tr><th class='l'>Item</th><th class='l'>Category</th><th>Txn</th><th>Qty</th><th>Gross</th>" +
    "<th>Discount</th><th>Net</th><th>Dis %</th></tr></thead><tbody>" + totalRow + rows +
    (items.length ? "" : "<tr><td colspan='8' class='sub'>No items for this code and these categories.</td></tr>") +
    "</tbody></table></div>" +
    "<p class='note'><button class='ghost' onclick='downloadItems()'>Download items (CSV)</button></p>";
}

function csvDownload(name, head, rows) {
  var text = [head].concat(rows).map(function (r) {
    return r.map(function (c) { return '"' + String(c === null || c === undefined ? "" : c).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
  a.download = name;
  a.click();
}
function downloadCodes() {
  if (!LAST) return;
  csvDownload("discount_codes.csv", ["Discount code", "Txn", "Qty", "Gross", "Discount", "Net", "Previous net", "Dis %"],
    LAST.labels.map(function (x) {
      return [x.label, x.cur.inv, Math.round(x.cur.qty), Math.round(x.cur.gross), Math.round(x.cur.disc), Math.round(x.cur.net),
        Math.round(x.prev.net), x.cur.gross ? (x.cur.disc / x.cur.gross * 100).toFixed(2) : ""];
    }));
}
function downloadItems() {
  if (!LAST) return;
  csvDownload("discount_items.csv", ["Item", "Category", "Txn", "Qty", "Gross", "Discount", "Net", "Dis %"],
    filteredItems(LAST).map(function (x) {
      var c = x.cur;
      return [x.item, x.cat, c.inv, Math.round(c.qty), Math.round(c.gross), Math.round(c.disc), Math.round(c.net),
        c.gross ? (c.disc / c.gross * 100).toFixed(2) : ""];
    }));
}

document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.id === "dcode") { STATE.code = t.value; calc(); return; }
  if (t.hasAttribute && t.hasAttribute("data-cat")) {
    var c = t.getAttribute("data-cat");
    var base = STATE.cats === null ? OPTS.categories.slice() : STATE.cats.slice();
    STATE.cats = t.checked ? base.concat(base.indexOf(c) < 0 ? [c] : []) : base.filter(function (x) { return x !== c; });
    renderOutput();
  }
});
document.addEventListener("input", function (e) {
  if (e.target.id !== "csearch") return;
  STATE.search = e.target.value;
  STATE.searching = true;
  renderOutput();
});
document.addEventListener("click", function (e) {
  var b = e.target.closest ? e.target.closest("[data-cat-all],[data-cat-none]") : null;
  if (!b) return;
  STATE.cats = b.hasAttribute("data-cat-all") ? null : [];
  renderOutput();
});

$("calc").addEventListener("click", calc);
$("kind").addEventListener("change", calc);
["brand", "region", "source", "session"].forEach(function (id) { $(id).addEventListener("change", calc); });
google.script.run.withSuccessHandler(setOptions).withFailureHandler(fail).getDiscountOptions();
</script>
</body>
</html>
