<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Target Planner</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:16px;background:#0A1020;color:#E5ECF8;font-size:14px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:22px 0 6px}
.sub{color:#9AA8C2;font-size:12px;margin:0 0 8px}
.note{color:#9AA8C2;font-size:12px;margin:6px 0}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
label{font-size:12px;color:#9AA8C2;display:flex;flex-direction:column;gap:3px}
select,input{background:#121C33;color:#E5ECF8;border:1px solid #24314f;border-radius:6px;padding:7px;font-size:13px}
input.sg{width:80px;padding:4px}
button{background:#3B82F6;color:#fff;border:0;border-radius:6px;padding:9px 14px;font-size:13px;cursor:pointer;margin-right:6px}
button.ghost{background:#121C33;border:1px solid #24314f}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0}
.card{background:#121C33;border:1px solid #24314f;border-radius:8px;padding:10px}
.card small{color:#9AA8C2;font-size:11px;display:block}
.card b{display:block;font-size:17px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid #24314f;text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr.tot td{font-weight:bold;border-top:2px solid #3B82F6}
tr.sub td{font-weight:bold;background:#0F1830}
.scroll{overflow-x:auto}
.up{color:#34D399}
.down{color:#F87171}
.warn{color:#FBBF24}
</style>
</head>
<body>
<h1>Target Planner</h1>
<p class="sub">Plans the target month from last year's month-on-month (MoM) movement. All figures in ₹, net sales.</p>

<div class="controls">
  <label>Target month <select id="target"></select></label>
  <label>Compare with (last year) <select id="compare"></select></label>
  <label>Channel
    <select id="channel">
      <option value="all">Overall</option>
      <option value="Offline">Offline (In Store)</option>
      <option value="Online">Online</option>
    </select>
  </label>
  <label>Store type <select id="type"><option value="all">All types</option></select></label>
  <label>Brand <select id="brand"><option value="all">All brands</option></select></label>
  <label>Region <select id="region"><option value="all">All regions</option></select></label>
  <label>Store <select id="store"><option value="all">All stores</option></select></label>
  <label>Growth % (blank = automatic) <input id="growth" type="number" step="0.1" placeholder="automatic"></label>
  <label>Automatic growth from
    <select id="basis">
      <option value="store">Each store's own MoM</option>
      <option value="region">Region MoM, same for all stores in the region</option>
      <option value="overall">Overall MoM, same for all stores</option>
    </select>
  </label>
  <label>Phasing method
    <select id="method">
      <option value="weekday">Each weekday's average last year</option>
      <option value="daytype">Mon-Thu / Fri-Sun average</option>
      <option value="samedate">Same date last year</option>
    </select>
  </label>
</div>
<button id="calc">Calculate</button>
<span id="status" class="sub"></span>

<div id="out"></div>

<script>
var OPTS = null;
var LAST = null;
var STORE_G = {};   // growth typed for individual stores in the store table, in percent (text)
var WEEK = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

function $(id) { return document.getElementById(id); }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function attr(t) { return esc(t).replace(/"/g, "&quot;"); }
function inr(n) { return (n === null || n === undefined || isNaN(n)) ? "—" : Math.round(n).toLocaleString("en-IN"); }
function pct(x) {
  if (x === null || x === undefined || isNaN(x)) return "—";
  return '<span class="' + (x >= 0 ? "up" : "down") + '">' + (x >= 0 ? "▲ " : "▼ ") + Math.abs(x * 100).toFixed(1) + "%</span>";
}
function addMonths(key, k) {
  var p = key.split("-").map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1 + k, 1)).toISOString().slice(0, 7);
}
function monthLabel(key) {
  return new Date(key + "-01T00:00:00Z").toLocaleDateString("en-IN", { month: "short", year: "numeric", timeZone: "UTC" });
}
function opt(value, label, selected) {
  return '<option value="' + attr(value) + '"' + (selected ? " selected" : "") + ">" + esc(label) + "</option>";
}

function setOptions(o) {
  OPTS = o;
  var future = [];
  for (var k = 1; k <= 12; k++) future.push(addMonths(o.latest, k));
  $("target").innerHTML = future.map(function (m) { return opt(m, monthLabel(m), m === o.nextMonth); }).join("");
  var defCompare = addMonths(o.nextMonth, -12);
  $("compare").innerHTML = o.months.map(function (m) { return opt(m, monthLabel(m), m === defCompare); }).join("");
  $("type").innerHTML = '<option value="all">All types</option>' + o.types.map(function (t) { return opt(t, t, false); }).join("");
  $("brand").innerHTML = '<option value="all">All brands</option>' + o.brands.map(function (b) { return opt(b, b, false); }).join("");
  $("region").innerHTML = '<option value="all">All regions</option>' + o.regions.map(function (r) { return opt(r, r, false); }).join("");
  fillStores();
  $("type").addEventListener("change", fillStores);
  $("status").textContent = "Choose the filters and press Calculate.";
}

// The store list follows the store type: COCO shows only COCO stores, FOFO only FOFO stores.
function fillStores() {
  var type = $("type").value;
  var list = OPTS.stores.filter(function (s) { return type === "all" || s.type === type; });
  $("store").innerHTML = '<option value="all">All stores</option>' + list.map(function (s) {
    return opt(s.name, s.name + " (" + s.region + ")", false);
  }).join("");
}

// Growth typed in the store table: kept here, and sent with every Calculate.
document.addEventListener("change", function (e) {
  var t = e.target;
  if (!t.getAttribute || t.getAttribute("data-sg") === null) return;
  var name = t.getAttribute("data-sg");
  if (String(t.value).trim() === "") delete STORE_G[name]; else STORE_G[name] = String(t.value).trim();
  $("status").textContent = "Growth typed for " + name + ". Press Calculate to update the targets.";
});

function params() {
  var sg = {};
  Object.keys(STORE_G).forEach(function (k) { sg[k] = STORE_G[k]; });
  return {
    targetMonth: $("target").value, compareMonth: $("compare").value, channel: $("channel").value,
    type: $("type").value, brand: $("brand").value, region: $("region").value, store: $("store").value,
    growth: $("growth").value, basis: $("basis").value, method: $("method").value, storeGrowth: sg
  };
}

function calc() {
  $("status").textContent = "Calculating… this can take a little while for the full store list.";
  google.script.run.withSuccessHandler(render).withFailureHandler(fail).getDashboard(params());
}
function fail(e) { $("status").textContent = "Error: " + (e && e.message ? e.message : e); }

function card(label, value, extra) {
  return '<div class="card"><small>' + esc(label) + '</small><b>' + value + "</b>" + (extra ? "<small>" + extra + "</small>" : "") + "</div>";
}

// Days and average day sales, Mon to Sun.
function daysBlock(d, m) {
  var head = "<tr><th class='l'>Month</th>" + WEEK.map(function (w) { return "<th>" + w + "</th>"; }).join("") + "<th>Days</th></tr>";
  var rows = d.days.rows.map(function (r) {
    var label = monthLabel(r.key) + (r.key === m.compareMonth ? " (last year)" : " (target)");
    return "<tr><td class='l'>" + esc(label) + "</td>" + r.counts.map(function (c) { return "<td>" + c + "</td>"; }).join("") +
      "<td><b>" + r.total + "</b></td></tr>";
  }).join("");
  var avgHead = "<tr><th class='l'>Month</th>" + WEEK.map(function (w) { return "<th>" + w + "</th>"; }).join("") + "<th>Month average per day</th></tr>";
  var avgRows = d.avgDay.rows.map(function (r) {
    var label = monthLabel(r.key) + (r.label === "projected" ? " projected" : " actual");
    return "<tr><td class='l'>" + esc(label) + "</td>" + r.avg.map(function (a) { return "<td>" + inr(a) + "</td>"; }).join("") +
      "<td><b>" + inr(r.overall) + "</b></td></tr>";
  }).join("");
  return "<h2>Days in the month</h2>" +
    '<div class="scroll"><table><thead>' + head + "</thead><tbody>" + rows + "</tbody></table></div>" +
    "<h2>Average day sales</h2>" +
    '<p class="note">Last year is the actual average for each weekday. The target month is the projected average, from the phasing below.</p>' +
    '<div class="scroll"><table><thead>' + avgHead + "</thead><tbody>" + avgRows + "</tbody></table></div>";
}

// The figures every row has: last year, the month before, the base, growth, target, and weekday averages.
function numCells(r) {
  return "<td>" + inr(r.ly) + "</td><td>" + inr(r.prev) + "</td><td>" + pct(r.mom) + "</td>" +
    "<td>" + inr(r.base) + "</td><td>" + pct(r.growthUsed) + "</td><td><b>" + inr(r.target) + "</b></td>" +
    "<td>" + inr(r.lyWeekdayPerDay) + "</td><td>" + inr(r.lyWeekendPerDay) + "</td>";
}
function totalOf(list) {
  var t = { ly: 0, prev: 0, base: 0, target: 0, lyWeekdayPerDay: null, lyWeekendPerDay: null, outletsLy: 0, outletsBase: 0 };
  list.forEach(function (r) {
    t.ly += r.ly; t.prev += r.prev; t.base += r.base; t.target += r.target;
    t.outletsLy += r.outletsLy; t.outletsBase += r.outletsBase;
  });
  t.mom = t.prev > 0 ? t.ly / t.prev - 1 : null;
  t.growthUsed = t.base > 0 ? t.target / t.base - 1 : null;
  return t;
}

function levelTable(title, note, rows, firstHead, summary) {
  var tot = totalOf(rows);
  tot.outletsLy = summary.outletsLy; tot.outletsBase = summary.outletsBase;
  var body = rows.map(function (r) {
    return "<tr><td class='l'>" + esc(r.name) + "</td><td>" + r.outletsLy + "</td><td>" + r.outletsBase + "</td>" + numCells(r) + "</tr>";
  }).join("");
  return "<h2>" + esc(title) + '</h2><p class="note">' + esc(note) + '</p><div class="scroll"><table><thead><tr><th class="l">' +
    esc(firstHead) + "</th><th>Outlets last year</th><th>Outlets now</th>" +
    "<th>LY net</th><th>Prev month net</th><th>LY MoM %</th><th>Base projected</th><th>Growth used</th><th>Target</th>" +
    "<th>LY Mon-Thu / day</th><th>LY Fri-Sun / day</th></tr></thead><tbody>" +
    "<tr class='tot'><td class='l'>Total</td><td>" + tot.outletsLy + "</td><td>" + tot.outletsBase + "</td>" + numCells(tot) + "</tr>" +
    body + "</tbody></table></div>";
}

function storeTable(rows) {
  var head = "<tr><th class='l'>Store</th><th class='l'>Region</th><th class='l'>Type</th><th class='l'>Status</th>" +
    "<th>LY net</th><th>Prev month net</th><th>LY MoM %</th><th>Base projected</th><th>Growth used</th><th>Growth typed</th>" +
    "<th>Target</th><th>LY Mon-Thu / day</th><th>LY Fri-Sun / day</th></tr>";
  var html = "", region = null, group = [];
  function rowHtml(r) {
    var typed = (r.typed === null || r.typed === undefined) ? "" : r.typed.toFixed(1);
    return "<tr><td class='l'>" + esc(r.name) + "</td><td class='l'>" + esc(r.region) + "</td><td class='l'>" + esc(r.type) +
      "</td><td class='l'>" + esc(r.status) + "</td>" + numCells(r) +
      "<td><input class='sg' type='number' step='0.1' data-sg='" + attr(r.name) + "' value='" + typed + "' placeholder='auto'></td>" +
      "<td><b>" + inr(r.target) + "</b></td></tr>";
  }
  function subHtml(name, list) {
    var t = totalOf(list);
    return "<tr class='sub'><td class='l'>" + esc(name) + " total</td><td></td><td></td><td></td><td>" + inr(t.ly) + "</td><td>" + inr(t.prev) +
      "</td><td>" + pct(t.mom) + "</td><td>" + inr(t.base) + "</td><td>" + pct(t.growthUsed) + "</td><td></td><td>" + inr(t.target) +
      "</td><td></td><td></td></tr>";
  }
  rows.forEach(function (r) {
    if (r.region !== region) {
      if (group.length) html += subHtml(region, group);
      region = r.region; group = [];
    }
    group.push(r);
    html += rowHtml(r);
  });
  if (group.length) html += subHtml(region, group);
  return '<h2>By store, grouped by region</h2>' +
    '<p class="note">Every store that traded last year is listed. A store with no sales in the base month is "Not trading now" and has no target. ' +
    'To set a growth for one store, type it in "Growth typed" (percent) and press Calculate. Blank = automatic.</p>' +
    '<div class="scroll"><table><thead>' + head + "</thead><tbody>" + html + "</tbody></table></div>";
}

function render(d) {
  LAST = d;
  var s = d.summary, m = d.meta;
  $("status").textContent = "Target " + monthLabel(m.targetMonth) + " against " + monthLabel(m.compareMonth) + ". " + m.growthMode + ".";
  var html = daysBlock(d, m) +
    '<h2>Outlets</h2><div class="cards">' +
    card("Outlets last year, " + monthLabel(m.compareMonth), inr(s.outletsLy), "stores with sales that month") +
    card("Outlets operating now, " + monthLabel(m.baseMonth), inr(s.outletsBase), "target outlets: " + inr(s.outletsTarget)) +
    card("Not trading now", inr(s.notTrading), "traded last year, no sales in " + monthLabel(m.baseMonth)) +
    card("New since last year", inr(s.newStores), "sales in " + monthLabel(m.baseMonth) + " but not last year") +
    "</div>" +
    '<h2>Summary</h2><div class="cards">' +
    card("Last year, " + monthLabel(m.compareMonth), "₹" + inr(s.lyNet), inr(s.lyOrders) + " orders, " + s.lyDays + " days") +
    card("Last year MoM, " + monthLabel(m.prevMonth) + " to " + monthLabel(m.compareMonth), pct(s.mom), "₹" + inr(s.prevNet) + " in " + monthLabel(m.prevMonth)) +
    card(monthLabel(m.baseMonth) + " projected to month end", "₹" + inr(s.baseNet),
      "actual to date ₹" + inr(s.baseActual) + " in " + s.baseElapsed + " of " + s.baseDays + " days") +
    card("Growth used", pct(s.growthApplied), m.growthMode.indexOf("entered") === 0 ? "entered by you" : "automatic, " + m.basis + " basis") +
    card("Target, " + monthLabel(m.targetMonth), "₹" + inr(s.target), m.storeOverrides ? m.storeOverrides + " store growth(s) typed" : "phased by day below") +
    "</div>";
  html += levelTable("By brand", "Each brand: outlets, last year, the base projection and the target.", d.brand, "Brand", s);
  html += levelTable("By region", "Each region: outlets, last year, the base projection and the target.", d.region, "Region", s);
  html += storeTable(d.store);
  html += '<h2>Phasing by date, ' + monthLabel(m.targetMonth) + '</h2>' +
    '<p class="note">Method: ' + ({ weekday: "each weekday's average last year", daytype: "Mon-Thu / Fri-Sun averages", samedate: "same date last year" })[m.method] + ".</p>" +
    '<div class="scroll"><table><thead><tr><th class="l">Date</th><th class="l">Day</th><th class="l">Type</th><th>Same date last year</th><th>Planned</th><th>Cumulative</th><th>% of month</th></tr></thead><tbody>' +
    d.phasing.map(function (p) {
      return '<tr><td class="l">' + esc(p.date) + '</td><td class="l">' + esc(p.weekday) + '</td><td class="l">' + esc(p.dayType) + "</td><td>" +
        inr(p.lySameDate) + "</td><td><b>" + inr(p.planned) + "</b></td><td>" + inr(p.cumulative) + "</td><td>" + (p.cumulativePct * 100).toFixed(1) + "%</td></tr>";
    }).join("") + '</tbody></table></div>' +
    '<p class="note"><button class="ghost" onclick="downloadStores()">Download store table (CSV)</button>' +
    '<button class="ghost" onclick="downloadPhasing()">Download phasing (CSV)</button></p>';
  $("out").innerHTML = html;
}

function csvDownload(name, head, rows) {
  var text = [head].concat(rows).map(function (r) {
    return r.map(function (c) { return '"' + String(c === null || c === undefined ? "" : c).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
  a.download = name;
  a.click();
}
function pc(v) { return v === null || v === undefined ? "" : (v * 100).toFixed(2); }
function downloadStores() {
  if (!LAST) return;
  csvDownload("store_targets.csv", ["Store", "Region", "Type", "Status", "LY net", "Prev month net", "LY MoM %", "Base projected", "Growth used %", "Target"],
    LAST.store.map(function (r) { return [r.name, r.region, r.type, r.status, Math.round(r.ly), Math.round(r.prev), pc(r.mom), Math.round(r.base), pc(r.growthUsed), Math.round(r.target)]; }));
}
function downloadPhasing() {
  if (!LAST) return;
  csvDownload("phasing.csv", ["Date", "Day", "Type", "Same date last year", "Planned", "Cumulative"],
    LAST.phasing.map(function (p) { return [p.date, p.weekday, p.dayType, Math.round(p.lySameDate), Math.round(p.planned), Math.round(p.cumulative)]; }));
}

$("calc").addEventListener("click", calc);
google.script.run.withSuccessHandler(setOptions).withFailureHandler(fail).getOptions();
</script>
</body>
</html>
